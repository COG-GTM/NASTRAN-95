name: python

on:
  push:
    branches: [master, main]
    paths: ["python/**", "mis/**", "inp/**", "demoout/**", ".github/workflows/python.yml"]
  pull_request:
    paths: ["python/**", "mis/**", "inp/**", "demoout/**", ".github/workflows/python.yml"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: python
    env:
      NASTRAN95PY_REQUIRE_FORTRAN: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install gfortran
        run: sudo apt-get update && sudo apt-get install -y gfortran && gfortran --version
      - name: Install nastran95py
        run: python -m pip install -e ".[dev]"
      - name: Ruff
        run: |
          ruff check .
          ruff format --check .
      - name: Reference manifest is current
        run: python -m nastran95py.reference.inventory --check
      - name: Build shared-kernel Fortran harness
        run: make -C tests/fortran_kernels
      - name: Build element Fortran harness (if present)
        run: |
          if [ -d tests/fortran_harness ]; then
            make -C tests/fortran_harness
          else
            echo "python/tests/fortran_harness not present yet; skipping element harness build"
          fi
      - name: Pytest
        run: python -m pytest

  # Oldest NumPy pyproject allows (1.x scalar promotion rules): the rod kernels'
  # REAL-emulating scalar and batched paths must stay bit-identical there too.
  test-numpy126:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    env:
      NASTRAN95PY_REQUIRE_FORTRAN: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install gfortran
        run: sudo apt-get update && sudo apt-get install -y gfortran && gfortran --version
      - name: Install nastran95py with numpy 1.26
        run: python -m pip install -e ".[dev]" "numpy==1.26.*"
      - name: Build Fortran harnesses
        run: make -C tests/fortran_kernels && make -C tests/fortran_harness
      - name: Pytest (rod kernels)
        run: python -m pytest tests/test_rod.py tests/test_rod_loads.py tests/test_rod_stress.py
      - name: Pytest (CTRMEM kernels)
        run: python -m pytest tests/test_trmem.py tests/test_trmem_stress.py
      - name: Pytest (CQDMEM1 kernels)
        run: python -m pytest tests/test_qdmem1.py
      - name: Pytest (CQDMEM kernels)
        run: python -m pytest tests/test_qdmem.py

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nastran95py"
version = "0.1.0"
description = "Python port of NASTRAN-95 element routines, validated against the Fortran"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "NASA Open Source Agreement 1.3" }
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.setuptools.packages.find]
include = ["nastran95py*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["fortran: compares against the compiled Fortran (needs gfortran)"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY", "SIM"]
